<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project card</title>
<!-- A project card: on the left the flock forms the project's own mark in its colour; a falcon
     crosses it every eight seconds. card.html?p=superuser|mnesio|murmuration|ferro. The description
     and tags live in README.md as text, so they reflow on phones. -->
<style>
  @font-face { font-family: "Fraunces"; src: url(fonts/fraunces-normal.woff2) format("woff2"); font-weight: 300 600; font-display: block; }
  @font-face { font-family: "Geist"; src: url(fonts/geist-normal.woff2) format("woff2"); font-weight: 300 600; font-display: block; }
  @font-face { font-family: "Geist Mono"; src: url(fonts/geist-mono-normal.woff2) format("woff2"); font-weight: 400 500; font-display: block; }
  :root { --flock-size: 0.19; --ink: #f3e7d3; --glow: #c9764a; color: #f3ece0; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  .sky {
    position: fixed; inset: 0; border-radius: 3.8vh; overflow: hidden;
    background:
      radial-gradient(34% 62% at 20% 52%, color-mix(in srgb, var(--glow) 34%, transparent), transparent 72%),
      linear-gradient(180deg, #070a17 0%, #0c1129 60%, #141634 100%);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.07);
  }
  .stars { position: absolute; inset: 0; opacity: 0.6; }
  canvas.flock { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .text { position: absolute; left: 41%; right: 5%; top: 50%; transform: translateY(-50%); }
  .kicker { margin: 0 0 3vh; font: 500 3.4vh/1 "Geist Mono", ui-monospace, monospace; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink); }
  .name { margin: 0; font: 400 19vh/0.95 "Fraunces", Georgia, serif; font-variation-settings: "opsz" 144; letter-spacing: -0.03em; }
  .line { margin: 2.6vh 0 0; max-width: 34em; font: 400 3.5vh/1.45 "Geist", system-ui, sans-serif; color: rgba(243, 236, 224, 0.78); }
  .chips { display: flex; flex-wrap: wrap; gap: 1.4vh; margin: 3.6vh 0 0; padding: 0; list-style: none; }
  .chips li { padding: 1vh 1.8vh; border-radius: 999px; box-shadow: inset 0 0 0 1px rgba(243, 236, 224, 0.2); font: 400 2.3vh/1 "Geist Mono", ui-monospace, monospace; color: rgba(243, 236, 224, 0.8); }
  .status { position: absolute; top: 8%; right: 4.5%; margin: 0; padding: 1.4vh 2.6vh; border-radius: 999px; font: 500 3vh/1 "Geist Mono", ui-monospace, monospace; letter-spacing: 0.08em; color: #0b0e1d; background: var(--ink); }
</style>
</head>
<body>
<div class="sky"><div class="stars"></div></div>
<section data-flock="mark" data-flock-anchor=".stage"><div class="stage"></div></section>
<div class="text">
  <p class="kicker"></p>
  <h1 class="name"></h1>
</div>
<p class="status"></p>
<script type="module">
  import { sampleCanvas, sampleImage, shapeFrom, placeAnchor, falcon, stars } from './shapes.js';
  const lum = (r, g, b) => (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
  const PROJECTS = {
    superuser: {
      name: 'Superuser', ink: '#a5a6ff', glow: '#5b5be0', status: 'Coming soon',
      kicker: 'A coworker that lives on your computer',
      line: 'The AI you can tell everything. It runs on your machine, asks before it acts, and shows you everything that left.',
      chips: ['macOS', 'no account', 'no telemetry', 'runs with the Wi-Fi off'],
      shape: async () => {
        await document.fonts.load('500 300px "Geist Mono"');
        return sampleCanvas((g, w, h) => {
          g.fillStyle = '#fff';
          g.font = '500 300px "Geist Mono"';
          g.textBaseline = 'middle';
          g.fillText('#', 40, h / 2 + 6);
          g.fillRect(250, h / 2 - 105, 78, 210);
        }, 380, 320, (r, g, b, a) => a > 140);
      },
    },
    mnesio: {
      name: 'mnesio', ink: '#6fd6e6', glow: '#2f79d6', status: 'Open source',
      kicker: 'Memory for AI agents',
      line: 'Memory that helps AI agents learn from outcomes, and improves their policies through a safety gate.',
      chips: ['Rust core', 'MCP server', 'Python + Node SDKs'],
      shape: () => sampleImage('../../data/mnesio-logo.png', 400, (r, g, b, a) => a > 200 && lum(r, g, b) > 0.32),
    },
    murmuration: {
      name: 'Murmuration', ink: '#f3e2c4', glow: '#d27a4c', status: 'Open source',
      kicker: 'An open agent skill',
      line: "Websites that move like what they're about. It finds your subject's verb and builds the site with real 3D made in code.",
      chips: ['any agent', 'HTML, CSS and JS', 'no build step'],
      shape: null, // flock.js's own serif M
    },
    ferro: {
      name: 'ferro', ink: '#ff8f57', glow: '#e0533a', status: 'Open source',
      kicker: 'Local code review',
      line: 'Understand your code changes before you push. Diffs, tests and security, reviewed on your own machine.',
      chips: ['Rust core', 'GitHub + GitLab', 'runs locally'],
      shape: () => sampleImage('../../data/ferro-logo.png', 256, (r, g, b, a) => a > 200 && r > 225 && g > 225 && b > 225),
    },
  };
  const key = new URLSearchParams(location.search).get('p') || 'murmuration';
  const p = PROJECTS[key];
  const root = document.documentElement;
  root.style.setProperty('--flock-ink', p.ink);
  root.style.setProperty('--ink', p.ink);
  root.style.setProperty('--glow', p.glow);
  document.title = p.name;
  document.querySelector('.kicker').textContent = p.kicker;
  document.querySelector('.name').textContent = p.name;
  document.querySelector('.status').textContent = p.status;
  stars(document.querySelector('.stars'), 120, key.length * 31);
  if (p.shape) {
    window.flockShapes = { mark: shapeFrom(await p.shape(), { sway: [0.5, 8], depth: 0.1, stray: 0.006 }) };
  }
  placeAnchor(document.querySelector('.stage'), innerWidth * 0.205, innerHeight * 0.5, innerHeight * 0.33);
  await import('./flock.js');
  falcon({ loop: 8000, at: 4600, pass: 1100, from: [-0.05, 0.62], to: [0.42, 0.36] });
</script>
</body>
</html>
