<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aniket Shukla</title>
<!-- The profile header: a flock writes the name against a night sky; every nine seconds a falcon
     crosses it and the letters close again. Recorded for README.md (see art/README.md). -->
<style>
  @font-face { font-family: "Geist"; src: url(fonts/geist-normal.woff2) format("woff2"); font-weight: 300 600; font-display: block; }
  @font-face { font-family: "Geist Mono"; src: url(fonts/geist-mono-normal.woff2) format("woff2"); font-weight: 400 500; font-display: block; }
  :root { --flock-ink: #f3e7d3; --flock-size: 0.21; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  .sky {
    position: fixed; inset: 0; border-radius: 3.4vh; overflow: hidden;
    background:
      radial-gradient(70% 55% at 50% 118%, rgba(214, 120, 84, 0.42), rgba(214, 120, 84, 0) 70%),
      radial-gradient(60% 50% at 82% 0%, rgba(92, 96, 210, 0.16), rgba(92, 96, 210, 0) 70%),
      linear-gradient(180deg, #05070f 0%, #0a0f26 42%, #171638 78%, #281c38 100%);
  }
  .stars { position: absolute; inset: 0; opacity: 0.9; }
  canvas.flock { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .label { position: absolute; margin: 0; font: 500 2.2vh/1 "Geist Mono", ui-monospace, monospace; letter-spacing: 0.3em; text-transform: uppercase; color: rgba(243, 231, 211, 0.7); }
  .handle { top: 8%; left: 4.5%; letter-spacing: 0.08em; text-transform: none; color: rgba(243, 231, 211, 0.5); }
  .role { left: 0; right: 0; bottom: 10%; text-align: center; }
</style>
</head>
<body>
<div class="sky"><div class="stars"></div></div>
<section data-flock="name" data-flock-anchor=".stage"><div class="stage"></div></section>
<p class="label handle">@aniketshukla1</p>
<p class="label role">Staff Software Engineer · Synopsys · Bangalore</p>
<script type="module">
  import { sampleCanvas, shapeFrom, placeAnchor, falcon, stars } from './shapes.js';
  stars(document.querySelector('.stars'), 260);
  await document.fonts.load('600 220px Geist');
  const pts = sampleCanvas((g, w, h) => {
    g.fillStyle = '#fff';
    g.font = '600 220px Geist';
    g.letterSpacing = '18px';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText('ANIKET', w / 2, h * 0.29);
    g.fillText('SHUKLA', w / 2, h * 0.71);
  }, 1500, 600, (r, g, b, a) => a > 140);
  window.flockShapes = { name: shapeFrom(pts, { sway: [0.34, 9], depth: 0.05, stray: 0.006 }) };
  placeAnchor(document.querySelector('.stage'), innerWidth / 2, innerHeight * 0.45, innerWidth * 0.29);
  await import('./flock.js');
  falcon({ loop: 9000, at: 5200, pass: 1500, from: [-0.06, 0.52], to: [1.06, 0.4] });
</script>
</body>
</html>
