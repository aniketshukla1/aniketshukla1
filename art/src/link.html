<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Project link</title>
<link rel="stylesheet" href="theme.css">
<style>
  body { height: 40px; }
  .strip { position: relative; width: 418px; height: 40px; display: flex; align-items: center; gap: 9px; padding: 0 14px 0 20px; overflow: hidden; border-radius: 10px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); }
  .tint { position: absolute; inset: 0; background: linear-gradient(90deg, var(--accent), transparent 46%); opacity: .1; }
  svg { position: relative; width: 15px; height: 15px; flex: none; fill: none; stroke: var(--accent-ink); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  b { position: relative; font-size: 13px; font-weight: 500; letter-spacing: -.008em; color: var(--text); white-space: nowrap; }
  span { position: relative; margin-left: auto; font: 400 11px/1 "Geist Mono", monospace; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  em { position: relative; font-style: normal; font-size: 14px; color: var(--accent-ink); }
</style>
</head>
<body>
<div class="strip" id="strip"></div>
<script type="module">
import { PROJECTS } from './projects.js';
const q = new URLSearchParams(location.search);
document.documentElement.dataset.theme = q.get('theme') || 'dark';
const p = PROJECTS[q.get('p')];
const icons = {
  globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.8 4 5.8 4 9s-1.4 6.2-4 9c-2.6-2.8-4-5.8-4-9s1.4-6.2 4-9Z"/>',
  book: '<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5v-15Z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 21H20v-3"/>',
};
const strip = document.getElementById('strip');
strip.style.setProperty('--accent', p.accent);
strip.innerHTML = `<div class="tint"></div><svg viewBox="0 0 24 24">${icons[p.link.icon]}</svg><b>${p.link.label}</b><span>${p.link.shown}</span><em>↗</em>`;
await document.fonts.ready;
const shown = strip.querySelector('span');
window.__problem = shown.scrollWidth > shown.clientWidth ? `the address is cut off for ${p.name}` : null;
window.__ready = true;
</script>
</body>
</html>
